<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="APTOS" />
  <meta name="theme-color" content="#1c2333" />
  <title>APTOS</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="Aptos_192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body, #root { width: 100%; height: 100%; }
    body { background: #f2f2ee; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #splash {
      position: fixed; inset: 0; background: #1c2333;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      z-index: 9999;
    }
    #splash img { width: 256px; height: 256px; border-radius: 54px; }
    #splash .name {
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 28px; font-weight: 900; letter-spacing: 5px;
      color: #fff; text-transform: uppercase;
    }
    #splash .tag {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px; font-style: italic; color: #c8d8e8;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="Aptos_512.png" alt="APTOS" />
    <div class="name">APTOS</div>
    <div class="tag">Doses Designed to Fit</div>
    <div style="font-family: 'Courier New', monospace; font-size: 11px; color: #4a6080; margin-top: 8px; letter-spacing: 1px;">v1.2</div>
  </div>
  <div id="root"></div>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script defer>
    const APP_VERSION = "1.2";

    // Service worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => {
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  if (confirm('A new version of APTOS is available. Reload to update?')) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                    window.location.reload();
                  }
                }
              });
            });
          })
          .catch(err => console.warn('SW registration failed:', err));
      });
    }

    async function loadApp() {
      const startTime = Date.now();

      try {
        // Fallback catalogue — used when formulary.json is unavailable (e.g. artifact sandbox)
        const FALLBACK_DB = [
          {
            generic: "Acetaminophen",
            formulary: true,
            formulations: [
              { label: "160 mg/5 mL suspension (32 mg/mL)", concentration: 32, unit: "mg",
                form: "liquid", doseUnit: "mg/kg", maxDose: 960,
                preferredVols: [1.25, 2.5, 3.75, 8, 10], deviceLimited: false,
                ndc: "50580-0140-04", item_id: "FALLBACK", _source: "FALLBACK" },
              { label: "325 mg tablet", concentration: 325, unit: "mg",
                form: "tablet", doseUnit: "mg/kg", maxDose: 975,
                canHalf: true, canQuarter: true,
                ndc: "50580-0449-30", item_id: "FALLBACK", _source: "FALLBACK" },
            ]
          },
          {
            generic: "morphine",
            formulary: true,
            formulations: [
              { label: "MORPHINE 2 MG/ML INJ", concentration: 2, unit: "mg",
                form: "injectable", doseUnit: "mg/kg", maxDose: 15,
                vialVol: 10, ndc: "00641-6008-25", item_id: "FALLBACK", _source: "FALLBACK" },
            ]
          },
        ];

        // Fetch JSX first (required), then data files with graceful fallback
        const [jsxRes, formularyRes, paramsRes] = await Promise.all([
          fetch('PedsDoseTable.jsx'),
          fetch(`formulary.json?v=${Date.now()}`).catch(() => null),
          fetch(`aptos_params.json?v=${Date.now()}`).catch(() => null),
        ]);

        const code = await jsxRes.text();

        let mergedDrugs = FALLBACK_DB;

        if (formularyRes && paramsRes) {
          try {
            const [formularyData, paramsData] = await Promise.all([
              formularyRes.json(),
              paramsRes.json(),
            ]);

        // ── Merge formulary + params into DRUG_DB ──────────────────────────
        const paramsMap = {};
        for (const p of paramsData.params) {
          paramsMap[p.generic.toLowerCase()] = p;
        }

        const mergedDrugs = [];
        for (const drug of formularyData.drugs) {
          const p = paramsMap[drug.generic.toLowerCase()];
          const overrides = p?.formulation_overrides || [];

          const formulations = [];
          const EXCLUDED_FORMS = new Set(['topical','ophthalmic','otic','nasal','inhalation','suppository']);
          for (const f of drug.formulations) {
            // Suppress non-APTOS routes
            if (EXCLUDED_FORMS.has(f.form)) continue;
            const label = f.label.toLowerCase();
            if (/ophthalm|otic|topical|nasal|inhal|suppository|cream|ointment|gel|lotion|patch|spray/.test(label)) continue;
            // Find matching override by label fragment (case-insensitive)
            const ov = overrides.find(o =>
              f.label.toLowerCase().includes(o.match_label_fragment.toLowerCase())
            );

            if (!ov) {
              // No params — include as disabled placeholder
              formulations.push({ ...f, doseUnit: null, maxDose: null, _disabled: true });
              continue;
            }

            const merged = {
              ...f,
              doseUnit:      p.doseUnit ?? null,
              maxDose:       ov.maxDose ?? null,
              _disabled:     false,
            };

            // Apply optional overrides
            if (ov.preferredVols  !== undefined) merged.preferredVols  = ov.preferredVols;
            if (ov.deviceLimited  !== undefined) merged.deviceLimited  = ov.deviceLimited;
            if (ov.canHalf        !== undefined) merged.canHalf        = ov.canHalf;
            if (ov.canQuarter     !== undefined) merged.canQuarter     = ov.canQuarter;

            // Ensure liquid defaults
            if (merged.form === 'liquid' && merged.preferredVols === undefined) {
              merged.preferredVols = [];
            }
            if (merged.form === 'liquid' && merged.deviceLimited === undefined) {
              merged.deviceLimited = false;
            }

            formulations.push(merged);
          }

          if (formulations.length === 0) continue;
          mergedDrugs.push({
            generic:      drug.generic,
            formulary:    drug.formulary,
            formulations,
          });
        }

        // True alphabetic sort — locale-aware, case-insensitive
        mergedDrugs.sort((a, b) => a.generic.localeCompare(b.generic, 'en', { sensitivity: 'base' }));

          } catch(e) {
            console.warn('Formulary merge failed, using fallback:', e);
            mergedDrugs = FALLBACK_DB;
          }
        }

        window.APTOS_DRUG_DB = mergedDrugs;

        // ── Compile and mount component ────────────────────────────────────
        const cleaned = code
          .replace(/^import.*?;\n/gm, '')
          .replace(/export default /, '')
          .replace(/[^\x00-\x7F]/g, ' ');  // strip non-ASCII (em-dashes in comments)

        const transpiled = Babel.transform(cleaned, { presets: ['react'] }).code;

        const componentFn = new Function('React', `
          const { useState, useMemo, useCallback, useEffect } = React;
          ${transpiled}
          return PedsDoseTable;
        `);

        const PedsDoseTable = componentFn(React);
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(PedsDoseTable));

        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, 2000 - elapsed);
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) splash.style.display = 'none';
        }, remaining);

      } catch (err) {
        console.error('Failed to load app:', err);
        document.getElementById('splash').innerHTML =
          '<p style="color:#e74c3c;padding:20px;font-family:sans-serif;">Error loading APTOS</p>';
      }
    }

    loadApp();
  </script>
</body>
</html>
