<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="APTOS" />
  <meta name="theme-color" content="#1c2333" />
  <title>APTOS</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="Aptos_192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body, #root { width: 100%; height: 100%; }
    body { background: #f2f2ee; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #splash {
      position: fixed; inset: 0; background: #1c2333;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      z-index: 9999;
    }
    #splash img { width: 256px; height: 256px; border-radius: 54px; }
    #splash .name {
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 28px; font-weight: 900; letter-spacing: 5px;
      color: #fff; text-transform: uppercase;
    }
    #splash .tag {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px; font-style: italic; color: #c8d8e8;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="Aptos_512.png" alt="APTOS" />
    <div class="name">APTOS</div>
    <div class="tag">Doses Designed to Fit</div>
    <div style="font-family:'Courier New',monospace;font-size:11px;color:#4a6080;margin-top:8px;letter-spacing:1px;">v2.0</div>
  </div>
  <div id="root"></div>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script defer>
    const APP_VERSION = "2.0";

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => {
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  if (confirm('A new version of APTOS is available. Reload to update?')) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                    window.location.reload();
                  }
                }
              });
            });
          })
          .catch(err => console.warn('SW registration failed:', err));
      });
    }

    async function loadApp() {
      const startTime = Date.now();
      try {
        // Fetch JSX (required) and formulary (graceful fallback to FALLBACK_DB)
        const [jsxRes, formularyRes] = await Promise.all([
          fetch('PedsDoseTable.jsx'),
          fetch(`formulary.json?v=${Date.now()}`).catch(() => null),
        ]);

        const code = await jsxRes.text();

        let drugDB = null;  // null → JSX uses its FALLBACK_DB

        if (formularyRes && formularyRes.ok) {
          try {
            const formularyData = await formularyRes.json();

            // ── Build DRUG_DB directly from formulary.json ─────────────────
            // v2.0: aptos_params.json removed — formulary.json is the sole
            // data source. doseUnit and maxDose are entered by the user.
            // canHalf / canQuarter / canEighth come from transform_formulary.py
            // SEG collapse logic.
            const EXCLUDED_FORMS = new Set([
              'topical','ophthalmic','otic','nasal','inhalation','suppository'
            ]);

            drugDB = [];
            for (const drug of formularyData.drugs) {
              const formulations = [];
              for (const f of drug.formulations) {
                if (EXCLUDED_FORMS.has(f.form)) continue;
                const label = (f.label || '').toLowerCase();
                if (/ophthalm|otic|topical|nasal|inhal|suppository|cream|ointment|gel|lotion|patch|spray/.test(label)) continue;

                const formulation = {
                  label:          f.label,
                  concentration:  f.concentration,
                  unit:           f.unit,
                  form:           f.form,
                  form_canonical: f.form_canonical || f.form,
                  doseUnit:       null,   // user-entered
                  maxDose:        null,   // user-entered
                  item_id:        f.item_id,
                  ndc:            f.ndc,
                  _source:        f._source,
                };

                // Enrichment fields
                if (f.rxcui)        formulation.rxcui       = f.rxcui;
                if (f.rxnorm_name)  formulation.rxnorm_name = f.rxnorm_name;
                if (f.rxnorm_tty)   formulation.rxnorm_tty  = f.rxnorm_tty;
                if (f._rxnorm_src)  formulation._rxnorm_src = f._rxnorm_src;

                // Liquid-specific
                if (f.form === 'liquid') {
                  formulation.preferredVols = f.preferredVols || [];
                  formulation.deviceLimited = f.deviceLimited || false;
                }

                // Solid divisibility (from SEG collapse in transform v3)
                if (f.form === 'tablet' || f.form === 'capsule') {
                  formulation.canHalf    = f.canHalf    ?? false;
                  formulation.canQuarter = f.canQuarter ?? false;
                  formulation.canEighth  = f.canEighth  ?? false;
                }

                // Injectable
                if (f.form === 'injectable') {
                  formulation.vialVol = f.vialVol || null;
                }

                formulations.push(formulation);
              }
              if (formulations.length === 0) continue;
              drugDB.push({
                generic:      drug.generic,
                formulary:    drug.formulary,
                formulations,
              });
            }

            // Alphabetic sort — locale-aware, case-insensitive
            drugDB.sort((a, b) => a.generic.localeCompare(b.generic, 'en', { sensitivity: 'base' }));

          } catch(e) {
            console.warn('Formulary load failed, using FALLBACK_DB:', e);
            drugDB = null;
          }
        }

        window.APTOS_DRUG_DB = drugDB;  // null → JSX uses FALLBACK_DB

        // ── Compile and mount ──────────────────────────────────────────────
        const cleaned = code
          .replace(/^import.*?;\n/gm, '')
          .replace(/export default /, '')
          .replace(/[^\x00-\x7F]/g, ' ');

        const transpiled = Babel.transform(cleaned, { presets: ['react'] }).code;

        const componentFn = new Function('React', `
          const { useState, useMemo, useCallback, useEffect } = React;
          ${transpiled}
          return PedsDoseTable;
        `);

        const PedsDoseTable = componentFn(React);
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(PedsDoseTable));

        const elapsed = Date.now() - startTime;
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) splash.style.display = 'none';
        }, Math.max(0, 2000 - elapsed));

      } catch(err) {
        console.error('Failed to load app:', err);
        document.getElementById('splash').innerHTML =
          '<p style="color:#e74c3c;padding:20px;font-family:sans-serif;">Error loading APTOS</p>';
      }
    }

    loadApp();
  </script>
</body>
</html>
